<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>ParkSpot - Daily Log</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #26364b;
        }

        nav {
            background: #172554;
            padding: 16px 30px;
            display: flex;
            align-items: center;
            gap: 28px;
            flex-wrap: wrap;
        }

        nav h2 {
            margin: 0 auto 0 0;
            color: white;
        }

        nav a {
            color: #dbeafe;
            text-decoration: none;
            font-weight: 600;
        }

        nav a:hover {
            color: white;
        }

        main {
            max-width: 1250px;
            margin: 35px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 25px;
            color: #172554;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 26px;
            box-shadow: 0 4px 15px rgba(15, 23, 42, 0.06);
        }

        .count {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            text-align: left;
            padding: 14px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #eff6ff;
            color: #334155;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .parked {
            background: #dcfce7;
            color: #166534;
        }

        .exited {
            background: #e2e8f0;
            color: #475569;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 25px;
        }

        @media (max-width: 600px) {
            nav {
                gap: 15px;
                padding: 16px;
            }

            main {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

<nav>

    <h2>ParkSpot</h2>

    <a href="/">Dashboard</a>

    <a href="/visitors">Visitors</a>

    <a href="/flats">Flats</a>

    <a href="/parking-slots">Parking Slots</a>

    <a href="/daily-log">Daily Log</a>

</nav>


<main>

    <h1>Daily Visitor Log</h1>


    <section class="card">

        <div class="count">
            Visitor records:
            <strong th:text="${#lists.size(visitors)}">0</strong>
        </div>


        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Visitor Name</th>

                        <th>Vehicle Number</th>

                        <th>Entry Time</th>

                        <th>Exit Time</th>

                        <th>Parking Slot</th>

                        <th>Status</th>

                    </tr>

                </thead>


                <tbody>

                    <tr th:each="visitor : ${visitors}">

                        <!-- ID -->
                        <td th:text="${visitor.id}">
                            1
                        </td>


                        <!-- Visitor Name -->
                        <td th:text="${visitor.visitorName}">
                            Yash
                        </td>


                        <!-- Vehicle Number -->
                        <td th:text="${visitor.vehicleNumber}">
                            TN21YA2008
                        </td>


                        <!-- Entry Time -->
                        <td th:text="${visitor.entryTime}">
                            -
                        </td>


                        <!-- Exit Time -->
                        <td>

                            <span
                                th:if="${visitor.exitTime != null}"
                                th:text="${visitor.exitTime}">
                            </span>

                            <span
                                th:if="${visitor.exitTime == null}">
                                -
                            </span>

                        </td>


                        <!-- Parking Slot -->
                        <td>

                            <span
                                th:if="${visitor.parkingSlot != null}"
                                th:text="${visitor.parkingSlot.slotNumber}">
                            </span>

                            <span
                                th:if="${visitor.parkingSlot == null}">
                                -
                            </span>

                        </td>


                        <!-- Status -->
                        <td>

                            <span
                                th:if="${visitor.exitTime == null}"
                                class="status parked">
                                Parked
                            </span>

                            <span
                                th:if="${visitor.exitTime != null}"
                                class="status exited">
                                Exited
                            </span>

                        </td>

                    </tr>


                    <!-- Empty table -->
                    <tr th:if="${#lists.isEmpty(visitors)}">

                        <td
                            colspan="7"
                            class="empty">

                            No visitor records found.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>

</main>

</body>

</html>
